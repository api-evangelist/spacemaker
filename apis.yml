name: Spacemaker
description: >-
  Spacemaker was a Norwegian proptech startup (founded 2016 in Oslo) that built
  cloud-based, AI-assisted generative design software for early-stage real
  estate and urban site planning, letting architects, developers, and urban
  planners rapidly explore massing, sunlight, wind, noise, and view analyses to
  optimize buildable sites. Backed by investors including Northzone, Spacemaker
  was acquired by Autodesk in November 2020 (reported ~$240M) and its technology
  was continued and rebranded as Autodesk Forma. The standalone spacemaker.ai
  domain now permanently (301) redirects to the Autodesk Forma product page, so
  there is no longer an independent Spacemaker developer portal, API, or
  documentation surface; developer/API access is provided through Autodesk
  Forma and the broader Autodesk Platform Services ecosystem.
